name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify code health
    runs-on: ubuntu-latest

    env:
      # Dummy values are enough for CI type-checking and build verification.
      # Real secrets are never committed.
      VITE_SUPABASE_URL: https://test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      VITE_SUPABASE_PROJECT_ID: test-project-id
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      APP_USER_CONNECTION_KEY_SECRET: dGVzdC1rZXk=

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsgo

      - name: Run tests
        run: bun run test

      - name: Production build
        run: bun run build
